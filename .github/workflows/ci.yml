name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Throwaway CI database (service container below). Not a secret: it exists only inside the job.
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_DB: electricity_ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: electricity_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests
        env:
          TEST_PG_ADMIN_URL: postgresql+psycopg2://ci:ci@localhost:5432/postgres
        run: >
          pytest --cov=src --cov=analytics_agent --cov-report=term-missing --cov-report=xml
          --junitxml=junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: electricity_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-dbt.txt
      - name: Install pipeline and dbt (separate venv, as locally)
        run: |
          pip install -r requirements-dev.txt
          python -m venv .venv-dbt
          .venv-dbt/bin/pip install -r requirements-dbt.txt
      - name: Load synthetic data through the real load step
        env:
          ALLOW_SYNTHETIC_LOAD: "1"
        run: python scripts/load_synthetic_warehouse.py
      - name: dbt build (models + all data tests)
        working-directory: dbt_electricity
        run: |
          cp profiles.example.yml profiles.yml
          ../.venv-dbt/bin/dbt build --profiles-dir . --project-dir .
