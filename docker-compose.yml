# PostgreSQL 16 for the electricity-market pipeline.
# Credentials and port come from .env (copy .env.example -> .env).
services:
  db:
    image: postgres:16-alpine
    container_name: emg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Store timestamps in UTC on the server side; we convert explicitly in Python.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host port defaults to 5433 to avoid clashing with a locally installed Postgres on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
